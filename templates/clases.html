<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>GYMPRO - Clases</title><link rel="stylesheet" href="/static/css/g.css"></head><body><main class="content"><h2>Gestión de clases</h2><p class="subtitle">Recepción programa clases, administra cupos y registra cancelaciones.</p><section class="card"><form id="claseForm"><input type="hidden" name="id_clase" id="id_clase"><div class="grid grid-3"><label>Nombre<input name="nombre" required></label><label>Disciplina<select name="id_disciplina" id="id_disciplina"></select></label><label>Entrenador<select name="id_entrenador" id="id_entrenador"></select></label><label>Fecha<input name="fecha" type="date" required></label><label>Horario<input name="horario" type="time" required></label><label>Duración (min)<input name="duracion" type="number" min="1" value="60"></label><label>Cupo máximo<input name="cupo_maximo" type="number" min="1" value="20"></label><label>Estado<select name="estado"><option>Activa</option><option>Inactiva</option></select></label></div><button type="submit">Guardar clase</button><button type="reset" id="limpiarClase">Limpiar</button><p id="claseMessage"></p></form></section><section class="card"><input id="buscarClase" placeholder="Buscar clase"><table><thead><tr><th>Clase</th><th>Disciplina</th><th>Entrenador</th><th>Fecha</th><th>Horario</th><th>Cupo</th><th>Disponibles</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="tablaClases"></tbody></table></section><section class="card"><h3>Cancelar clase</h3><form id="cancelacionForm"><div class="grid grid-3"><label>Clase<select name="id_clase" id="cancelClase"></select></label><label>Fecha<input name="fecha" type="date" required></label><label>Motivo<input name="motivo" required></label></div><button type="submit">Registrar cancelación</button><p id="cancelacionMessage"></p></form></section></main><script src="/static/js/clases.js"></script></body></html>
