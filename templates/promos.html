<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GYMPRO - Promociones</title>
<link rel="stylesheet" href="/static/css/g.css">
</head>
<body>

<main class="content">
<h2>Promociones</h2><p>La creación y gestión de promociones corresponde al gerente.</p><section class="card"><button id="crearPromo">+ Crear promo</button><input id="buscarPromo" placeholder="Buscar promoción"></section><section class="card"><table><thead><tr><th>Nombre</th><th>Descripción</th><th>Tipo</th><th>Valor</th><th>Inicio</th><th>Fin</th><th>Estado</th><th>Acciones</th></tr></thead><tbody><tr><td>Regreso al gym</td><td>Descuento en renovación</td><td>Porcentaje</td><td>10%</td><td>01/08/2026</td><td>31/08/2026</td><td>Activa</td><td>Editar</td></tr></tbody></table></section><section class="card"><h3>Crear promoción</h3><form id="promoForm"><div class="grid"><label>Nombre<input name="nombre" required></label><label>Descripción<textarea name="descripcion"></textarea></label><label>Tipo<select name="tipo"><option value="descuento">Porcentaje</option><option value="otro">Monto</option></select></label><label>Valor<input name="valor" type="number" step="0.01" min="0" required></label><label>Inicio<input name="fecha_inicio" type="date" required></label><label>Fin<input name="fecha_fin" type="date" required></label><label>Estado<select name="estado"><option value="activa">Activa</option><option value="inactiva">Inactiva</option></select></label></div><button>Guardar promoción</button><p id="promoMessage"></p></form></section>
</main>
<script src="/static/js/promos.js"></script>
</body>
</html>
