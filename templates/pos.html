<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GYMPRO - Punto de venta</title>
<link rel="stylesheet" href="/static/css/g.css">
</head>
<body>

<main class="content">
<h2>Punto de venta</h2><section class="grid"><article class="card"><h3>Productos</h3><input id="buscarVenta" placeholder="Buscar producto"><div id="listaProductos"></div></article><article class="card"><h3>Venta</h3><table><thead><tr><th>Producto</th><th>Cantidad</th><th>Precio</th><th>Subtotal</th></tr></thead><tbody id="carrito"></tbody></table><h3 id="totalVenta">Total: $0.00</h3><label>Cliente<input id="clienteVenta" placeholder="No. socio opcional"></label><label>Método<select id="metodoPago"><option value="efectivo">Efectivo</option><option value="tarjeta">Tarjeta</option><option value="transferencia">Transferencia</option></select></label><button id="cobrar">Registrar venta</button><p id="ventaMessage"></p></article></section>
</main>
<script src="/static/js/pos.js"></script>
</body>
</html>
